name: sentinel

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "8883:8883"
    environment:
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD}
    command:
      - sh
      - -c
      - mkdir -p /mosquitto/certs && cp /src/config/* /mosquitto/config/ && cp /src/certs/ca.crt /src/certs/server.crt /src/certs/server.key /mosquitto/certs/ && chown mosquitto:mosquitto /mosquitto/config/* /mosquitto/certs/* && chmod 0600 /mosquitto/config/passwd /mosquitto/config/acl /mosquitto/certs/server.key && exec mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./mosquitto/config:/src/config:ro
      - ./mosquitto/certs:/src/certs:ro
      - mosquitto_data:/mosquitto/data
    networks: [mqtt]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt --insecure -u backend -P $$MQTT_BACKEND_PASSWORD -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build: ../api
    container_name: api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    volumes:
      - ../api/:/api   # rechargement à chaud en dev
      - ./mosquitto/certs/ca.crt:/certs/ca.crt:ro
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    networks: [default, db, mqtt]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  interface:
    build:
      context: ../interface
    container_name: interface
    restart: unless-stopped
    ports:
      - "8080:80"
    networks: [default]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [mqtt]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [mqtt]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [mqtt]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  mqtt:
    ipam:
      config: [{ subnet: 172.28.1.0/24 }]
  db:
    internal: true
    ipam:
      config: [{ subnet: 172.28.2.0/24 }]

volumes:
  mosquitto_data:
  db_data:
  grafana_data:
  prometheus_data:
